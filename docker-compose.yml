services:
  db:
    image: postgres:16
    container_name: krillion-db
    environment:
      POSTGRES_DB: krillion
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-krillion} -d krillion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: